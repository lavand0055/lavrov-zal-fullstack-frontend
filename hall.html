<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зал — Карточка зала</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
         <img src="img/logo.jpg" alt="Зал" class="logo__img"> 
        Зал
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="sessions.html" class="nav__link">Сеансы</a>
        <a href="hall.html" class="nav__link active">Залы</a>
        <a href="profile.html" class="nav__link">Профиль</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" class="nav__link">Главная</a>
    <a href="sessions.html" class="nav__link">Сеансы</a>
    <a href="hall.html" class="nav__link active">Залы</a>
    <a href="profile.html" class="nav__link">Профиль</a>
  </div>

  <main>
    <div class="container">
      <h1 class="page-title">Карточка зала</h1>

      <div class="hall-card" id="hall-detail">
        <!-- Заполняется JS -->
      </div>

      <section class="mt-3">
        <h2 class="section-title">Оценки зрителей</h2>
        <div class="ratings" id="ratings">
          <div class="rating-item">
            <span>Звук</span>
            <strong id="rating-sound">—</strong>
          </div>
          <div class="rating-item">
            <span>Температура</span>
            <strong id="rating-temp">—</strong>
          </div>
          <div class="rating-item">
            <span>Чистота</span>
            <strong id="rating-clean">—</strong>
          </div>
        </div>
        <button class="btn btn--primary mt-2" data-open-modal="review-modal">Оставить оценку</button>
      </section>

      <section class="mt-3">
        <h2 class="section-title">Отзывы</h2>
        <div id="hall-reviews-list" class="cards-grid">
          <p class="empty-state">Пока нет оценок.</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Модалка оценки -->
  <div class="modal" id="review-modal">
    <div class="modal__content">
      <div class="modal__header">
        <h3>Оценить зал</h3>
        <button class="modal__close" data-close-modal>&times;</button>
      </div>
      <form id="review-form">
        <label>
          Звук (1–5)
          <input type="number" name="sound" min="1" max="5" required>
        </label>
        <label>
          Температура (1–5)
          <input type="number" name="temp" min="1" max="5" required>
        </label>
        <label>
          Чистота (1–5)
          <input type="number" name="clean" min="1" max="5" required>
        </label>
        <label>
          Комментарий
          <textarea name="comment" rows="3" placeholder="Как было в зале?"></textarea>
        </label>
        <div class="modal__actions">
          <button type="button" class="btn" data-close-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Отправить</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Зал — выбор сеанса с учётом качества зала. Алматы, 2026</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
