<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зал — Главная</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
         <img src="img/logo.jpg" alt="Зал" class="logo__img"> 
        Зал
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link active">Главная</a>
        <a href="sessions.html" class="nav__link">Сеансы</a>
        <a href="hall.html" class="nav__link">Залы</a>
        <a href="profile.html" class="nav__link">Профиль</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" class="nav__link active">Главная</a>
    <a href="sessions.html" class="nav__link">Сеансы</a>
    <a href="hall.html" class="nav__link">Залы</a>
    <a href="profile.html" class="nav__link">Профиль</a>
  </div>

  <main>
    <div class="container">
      <div class="flex-between mb-2">
        <h1 class="page-title">Главная</h1>
        <button class="btn btn--primary" data-open-modal="filter-modal">Фильтры</button>
      </div>

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-card__label">Сеансов сегодня</div>
          <div class="stat-card__value" id="stat-sessions">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Средняя оценка залов</div>
          <div class="stat-card__value" id="stat-rating">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Ближайший кинотеатр</div>
          <div class="stat-card__value stat-card__value--small" id="stat-nearest">—</div>
        </div>
      </section>

      <section class="mt-3">
        <h2 class="section-title">Топ залов</h2>
        <div class="cards-grid" id="top-halls">
          <!-- Заполняется JS -->
        </div>
      </section>

      <section class="mt-3">
        <h2 class="section-title">Ближайшие сеансы</h2>
        <div class="cards-grid" id="sessions-preview">
          <!-- Заполняется JS -->
        </div>
      </section>
    </div>
  </main>

  <!-- Модалка фильтров -->
  <div class="modal" id="filter-modal">
    <div class="modal__content">
      <div class="modal__header">
        <h3>Фильтры</h3>
        <button class="modal__close" data-close-modal>&times;</button>
      </div>
      <form id="filter-form">
        <label>
          День
          <select name="day">
            <option value="">Любой</option>
            <option value="today">Сегодня</option>
            <option value="tomorrow">Завтра</option>
          </select>
        </label>
        <label>
          Тип зала
          <select name="type">
            <option value="">Любой</option>
            <option value="quiet">Тихий</option>
            <option value="warm">Тёплый</option>
            <option value="clean">Чистый</option>
          </select>
        </label>
        <div class="modal__actions">
          <button type="button" class="btn" data-close-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Применить</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Зал — выбор сеанса с учётом качества зала. Алматы, 2026</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
<!-- изменение -->
