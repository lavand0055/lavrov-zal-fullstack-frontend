<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зал — Сеансы</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
         <img src="img/logo.jpg" alt="Зал" class="logo__img"> 
        Зал
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="sessions.html" class="nav__link active">Сеансы</a>
        <a href="hall.html" class="nav__link">Залы</a>
        <a href="profile.html" class="nav__link">Профиль</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" class="nav__link">Главная</a>
    <a href="sessions.html" class="nav__link active">Сеансы</a>
    <a href="hall.html" class="nav__link">Залы</a>
    <a href="profile.html" class="nav__link">Профиль</a>
  </div>

  <main>
    <div class="container">
      <h1 class="page-title">Сеансы</h1>

      <div class="filters-bar">
        <input type="search" id="search-input" placeholder="Поиск по фильму или кинотеатру..." class="search-input">
        <select id="filter-type" class="select">
          <option value="">Все залы</option>
          <option value="quiet">Тихий</option>
          <option value="warm">Тёплый</option>
          <option value="clean">Чистый</option>
        </select>
      </div>

      <div class="cards-grid" id="sessions-list">
        <!-- Заполняется JS -->
      </div>

      <p class="empty-state" id="empty-state" hidden>Ничего не найдено. Попробуй изменить фильтры.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Зал — выбор сеанса с учётом качества зала. Алматы, 2026</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
