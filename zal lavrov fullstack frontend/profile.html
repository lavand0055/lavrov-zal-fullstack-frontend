<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зал — Профиль</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
         <img src="img/logo.jpg" alt="Зал" class="logo__img"> 
        Зал
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="sessions.html" class="nav__link">Сеансы</a>
        <a href="hall.html" class="nav__link">Залы</a>
        <a href="profile.html" class="nav__link active">Профиль</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" class="nav__link">Главная</a>
    <a href="sessions.html" class="nav__link">Сеансы</a>
    <a href="hall.html" class="nav__link">Залы</a>
    <a href="profile.html" class="nav__link active">Профиль</a>
  </div>

  <main>
    <div class="container">
      <h1 class="page-title">Профиль</h1>

      <form id="profile-form" class="profile-form">
        <label>
          Имя
          <input type="text" name="name" id="profile-name" required placeholder="Как тебя зовут?">
        </label>
        <label>
          Город
          <input type="text" name="city" id="profile-city" value="Алматы" required>
        </label>
        <label>
          Предпочитаемый тип зала
          <select name="pref" id="profile-pref">
            <option value="">Без предпочтений</option>
            <option value="quiet">Тихий</option>
            <option value="warm">Тёплый</option>
            <option value="clean">Чистый</option>
          </select>
        </label>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </form>

      <section class="mt-3">
        <h2 class="section-title">Мои оценки залов</h2>
        <div id="my-reviews">
          <p class="empty-state">Пока нет оценок.</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Зал — выбор сеанса с учётом качества зала. Алматы, 2026</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
